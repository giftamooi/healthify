# Gateway: satu pintu masuk + pembatasan jumlah pemanggilan.
# Di belakang Cloudflare Tunnel, IP asli klien ada di header CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

limit_req_zone $client_ip zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://core-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location = / {
        return 200 'Healther API. Dokumentasi: /api/docs\n';
        add_header Content-Type text/plain;
    }
}
