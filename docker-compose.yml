services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    env_file: .env
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - healthify-data:/data

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [core-service]
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file: .env
    mem_limit: 128m
    cpus: 0.25
    depends_on: [gateway]
    profiles: ["tunnel"]

volumes:
  healthify-data: