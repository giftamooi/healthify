services:
  core-service:
    build: ./core-service
    restart: unless-stopped
    env_file: .env            # rahasia, jangan di-commit
    mem_limit: 256m           # jaga STB tidak hang
    cpus: 0.5
    volumes:
      - ./data:/data          # database SQLite bertahan walau kontainer dibuat ulang

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports: ["8080:80"]        # untuk tes lokal / LAN; tunnel memakai gateway:80 di dalam jaringan docker
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [core-service]
    mem_limit: 64m
    cpus: 0.25

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file: .env
    mem_limit: 128m
    cpus: 0.25
    depends_on: [gateway]
    profiles: ["tunnel"]      # tidak ikut jalan di laptop; aktifkan di STB
